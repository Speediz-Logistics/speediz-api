# HTTP — redirect everything to HTTPS, but allow Certbot verification
server {
    listen 80;
    server_name logistic.laseavyong.com;

    # Allow Let's Encrypt to verify domain ownership
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main application
server {
    listen 443 ssl;
    server_name logistic.laseavyong.com;
    index index.php index.html;
    root /var/www/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # SSL Certificates (auto-managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/logistic.laseavyong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistic.laseavyong.com/privkey.pem;

    # SSL security configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
